services:
  cabinas-uji-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cabinas-uji-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    restart: unless-stopped
    # Improved resource limits for Puppeteer in Docker
    shm_size: '1gb'
